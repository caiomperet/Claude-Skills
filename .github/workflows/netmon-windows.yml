name: netmon Windows installer

on:
  push:
    branches: ["**"]
    tags: ["netmon-v*"]
    paths:
      - "netmon/**"
      - ".github/workflows/netmon-windows.yml"
  workflow_dispatch:
    inputs:
      release:
        description: "Publicar Release netmon-v<versão> com o instalador"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: netmon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name netmon netmon_gui.py

      - name: Smoke test executable
        run: |
          # Executável de janela: o PowerShell não espera por ele, então usamos Start-Process -Wait.
          $p = Start-Process -FilePath .\dist\netmon\netmon.exe -ArgumentList "status" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "netmon.exe status saiu com código $($p.ExitCode)" }
          Get-Content (Join-Path $env:LOCALAPPDATA "netmon\config.json") | Select-Object -First 3

      - name: Build installer (Inno Setup)
        id: build
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = python -c "import netmon; print(netmon.VERSION)"
          & $iscc "/DMyAppVersion=$version" deploy\netmon.iss
          Get-Item dist\netmon-setup.exe
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - uses: actions/upload-artifact@v4
        with:
          name: netmon-setup
          path: netmon/dist/netmon-setup.exe
          if-no-files-found: error

      # Release: em push de tag netmon-v*, ou em execução manual com "release" marcado
      # (neste caso a tag netmon-v<versão> é criada no commit atual).
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/netmon-v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: netmon-v${{ steps.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: netmon ${{ steps.build.outputs.version }}
          files: netmon/dist/netmon-setup.exe
          generate_release_notes: true
